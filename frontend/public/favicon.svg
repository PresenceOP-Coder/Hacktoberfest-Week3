<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ears -->
  <polygon points="12,24 18,4 28,18" fill="#00627A" stroke="#00323F" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="52,24 46,4 36,18" fill="#00627A" stroke="#00323F" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="16,20 19,8 24,18" fill="#FFE4B5" opacity="0.6" />
  <polygon points="48,20 45,8 40,18" fill="#FFE4B5" opacity="0.6" />

  <!-- Head -->
  <circle cx="32" cy="36" r="26" fill="#00627A" stroke="#00323F" stroke-width="3" />

  <!-- Face cream patch -->
  <path
    d="M 16,30 C 18,22 24,20 32,20 C 40,20 46,22 48,30 C 50,42 44,52 32,52 C 20,52 14,42 16,30 Z"
    fill="#FFE4B5"
    stroke="#00323F"
    stroke-width="2"
  />

  <!-- Sleeping eyes (happy curves) -->
  <path d="M 22,32 Q 26,36 30,32" fill="none" stroke="#00323F" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 34,32 Q 38,36 42,32" fill="none" stroke="#00323F" stroke-width="2.5" stroke-linecap="round" />

  <!-- Nose -->
  <ellipse cx="32" cy="38" rx="1.5" ry="1" fill="#00323F" />

  <!-- Smiling mouth with tiny fangs -->
  <path d="M 28,42 Q 32,45 36,42" fill="none" stroke="#00323F" stroke-width="2" stroke-linecap="round" />
  <polygon points="27,42 29,42 28,45" fill="#FFFFFF" stroke="#00323F" stroke-width="0.8" />
  <polygon points="35,42 37,42 36,45" fill="#FFFFFF" stroke="#00323F" stroke-width="0.8" />
</svg>
